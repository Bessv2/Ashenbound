name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable
  # Godot looks for templates in a folder named <version>.<status>.
  GODOT_TEMPLATES_DIR: 4.7.2.stable

jobs:
  test-and-build:
    name: Test and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Godot from cache
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATES_DIR }}
          key: godot-${{ env.GODOT_VERSION }}-linux-android-v1

      - name: Download Godot and Android export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIR}"
          mkdir -p "$HOME/godot" "$templates"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" "$HOME/godot/godot"
          curl -fsSLO "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          # Only the Android templates are needed; the full set is about 1 GB.
          unzip -q -j "Godot_v${GODOT_VERSION}_export_templates.tpz" \
            "templates/version.txt" "templates/android_*" -d "$templates"

      - name: Add Godot to PATH
        run: |
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          godot --version
          java -version
          ls "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIR}"

      # The first import also creates Godot's editor settings, taking the JDK
      # and Android SDK paths from JAVA_HOME and ANDROID_HOME, and generates
      # the debug keystore used to sign the APK.
      - name: Run tests
        run: tools/test.sh

      - name: Install Android build-tools
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "build-tools;36.1.0" "platform-tools" > /dev/null
          echo "$ANDROID_HOME/build-tools/36.1.0" >> "$GITHUB_PATH"

      - name: Export debug APK
        run: tools/export-android-debug.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          path: build/android/ashenbound-debug.apk
          archive: false
          retention-days: 14
          if-no-files-found: error

      # An emulator is not a phone: this catches crashes, a broken start and
      # misplaced controls on every change, but its frame rate means nothing.
      # Experimental until it has proven stable, so it cannot fail the job.
      - name: Export debug APK for the emulator (x86_64)
        run: |
          PRESET="Android x86_64 (CI emulator)" \
          APK="$PWD/build/android/ashenbound-debug-x86_64.apk" \
          tools/export-android-debug.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Device test on an emulator
        id: emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: env ALLOW_EMULATOR=1 SOAK_SECONDS=20 RELAUNCH_WAIT=10 tools/device-test.sh build/android/ashenbound-debug-x86_64.apk

      - name: Show the emulator test summary
        if: always()
        run: |
          # The emulator step may have failed before writing anything (it is
          # allowed to); there is then nothing to show, and that is not an error.
          shopt -s nullglob
          echo "emulator step outcome: ${{ steps.emulator.outcome }}"
          results=(build/device-test/*/)
          if (( ${#results[@]} == 0 )); then
            echo "No emulator test results."
            exit 0
          fi
          for summary in build/device-test/*/summary.md; do cat "$summary"; done
          for errors in build/device-test/*/errors.txt; do echo "--- $errors"; head -40 "$errors"; done
          for dir in build/device-test/*/; do
            echo "--- Godot lines in the log (${dir})"
            grep -E "[IWE]/godot" "${dir}logcat.txt" | head -30 || true
            echo "--- Frame statistics lines"
            grep -c "PERF fps=" "${dir}logcat.txt" || true
            echo "--- Not responding, fatal errors"
            grep -iE "ANR in|am_anr|not responding|FATAL|Fatal signal|am_crash|am_proc_died.*ashenbound" "${dir}logcat.txt" | head -15 || true
            echo "--- Screenshot statistics (${dir})"
            python3 -m pip install --quiet pillow
            python3 tools/screenshot_stats.py "$dir"
          done

      - name: Upload emulator test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-device-test
          path: build/device-test
          retention-days: 14
          if-no-files-found: ignore
